<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Код подтверждения email</title>
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.5; color: #1a1a1a; max-width: 480px; margin: 0 auto; padding: 24px;">
    <h2 style="margin: 0 0 16px;">Подтверждение email</h2>
    <p>Здравствуйте, {{ email }}!</p>
    <p>Ваш код подтверждения:</p>
    <p style="font-size: 32px; font-weight: 700; letter-spacing: 4px; padding: 16px 0; text-align: center;">{{ code }}</p>
    <p>Код действителен в течение нескольких минут. Если вы не запрашивали подтверждение, просто проигнорируйте это письмо.</p>
  </body>
</html>
