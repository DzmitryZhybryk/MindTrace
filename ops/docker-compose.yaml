name: myjourney

# Единый лимит на docker json-file логи для ВСЕХ сервисов: max-size x max-file = кап 30 MB
# на контейнер. Без него дефолт Docker — без лимита, и при краш-лупе лог за ночь может
# забить диск. Anchor вместо повтора на каждом сервисе, чтобы новый сервис не забыть.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-dev-backend: &dev-backend
  build:
    target: dev
  volumes:
    - ./backend:/src
  networks:
    - default
  logging: *default-logging

# Зависимости живут в образе (/opt/venv), а не в смонтированном коде: после правки
# pyproject.toml или uv.lock нужна пересборка. `make run` собирает сам, `make watch` — на лету.
x-rebuild-on-deps: &rebuild-on-deps
  watch:
    - action: rebuild
      path: ./backend/pyproject.toml
    - action: rebuild
      path: ./backend/uv.lock

networks:
  default:
    name: myjourney-network
    external: true

services:

  myjourney_migrate:
    <<: *dev-backend
    container_name: myjourney_migrate

  myjourney_geo_load:
    <<: *dev-backend
    container_name: myjourney_geo_load

  app:
    <<: *dev-backend
    container_name: myjourney_app
    command: >
      sh -c "uvicorn app.main:create_app --factory --no-use-colors
      --host ${HOST} --port ${PORT}
      --log-level error
      ${RELOAD:+--reload --reload-dir app}"
    ports:
      - "8050:8000"
    restart: unless-stopped
    develop: *rebuild-on-deps

  myjourney_worker:
    <<: *dev-backend
    container_name: myjourney_worker
    restart: unless-stopped
    develop: *rebuild-on-deps

  frontend:
    build:
      target: dev
    container_name: myjourney_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    restart: unless-stopped
    networks:
      - default
    logging: *default-logging

  myjourney_pg:
    container_name: myjourney_pg
    ports:
      - "5439:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - default
    logging: *default-logging

  loki:
    image: grafana/loki:3.6.3
    container_name: myjourney_loki
    command: -config.file=/etc/loki/loki.yaml -log.level=error -target=all
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./ops/loki.yaml:/etc/loki/loki.yaml:ro
    restart: unless-stopped
    networks:
      - default
    logging: *default-logging

  promtail:
    image: grafana/promtail:3.6.3
    container_name: myjourney_promtail
    command:
      - -config.file=/etc/promtail/config.yml
      - -log.level=error
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./ops/promtail-config.yml:/etc/promtail/config.yml:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - default
    logging: *default-logging

  grafana:
    image: grafana/grafana:12.3.1
    container_name: myjourney_grafana
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_LOG_LEVEL: warn
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - default
    logging: *default-logging

volumes:
  pg_data:
  loki_data:
  grafana_data:
  frontend_node_modules:
