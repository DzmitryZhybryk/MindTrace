# Одноразовый стек для фронтовых Playwright-e2e, override поверх docker-compose.base.yaml.
#
# Зачем отдельный стек, а не дев: e2e сеют пользователей через POST /v1/auth/register/,
# и при прогоне против дев-стека они копятся в персистентной myjourney_pg (том pg_data) навсегда.
# Здесь Postgres живёт в tmpfs (RAM) без named-тома → БД исчезает на `down`, дев-база не трогается.
# Это перенос подхода backend-testcontainers (одноразовая БД на прогон) на уровень стека — e2e
# нужно всё приложение, а не голый Postgres.
#
# Запуск — корневым `make test-e2e` (up --wait → playwright → down -v). Свой проект (`name`)
# изолирует контейнеры/тома/сеть от дев-стека: можно держать оба разом. `container_name` нигде не
# задаём (compose сам префиксует проектом → нет клеша с дев), сеть — дефолтная проектная
# (`docker network create` не нужен). Имена сервисов myjourney_pg/app совпадают с хостами в .env и
# vite.config (API_PROXY_TARGET) → .env переиспользуется как есть. Оверрайды — только Resend и адрес
# S3-эмулятора: у e2e свой порт (9051), чтобы стек жил рядом с дев-стеком, а дев-.env указывает на 9050.
name: myjourney_e2e

x-e2e-backend: &e2e-backend
  build:
    target: dev

x-e2e-storage-endpoint: &e2e-storage-endpoint
  MEDIA_S3_ENDPOINT_URL: "http://s3.localhost:9051"

services:

  myjourney_pg:
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      interval: 3s
      retries: 15
      start_period: 5s

  myjourney_migrate:
    <<: *e2e-backend

  # Кеш датасетов общий с дев-стеком и с кешем CI (хостовый backend/.geo-cache).
  myjourney_geo_load:
    <<: *e2e-backend
    volumes:
      - ./backend/.geo-cache:/src/.geo-cache

  # Тот же эмулятор, что в деве (там — почему один порт внутри и снаружи), но данные в RAM.
  myjourney_s3:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      RUSTFS_ADDRESS: ":9051"
      RUSTFS_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY}
    ports:
      - "9051:9051"
    # tmpfs монтируется от root, а RustFS работает под своим пользователем (uid 10001).
    tmpfs:
      - /data:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9051/health"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      default:
        aliases:
          - s3.localhost

  myjourney_s3_bootstrap:
    <<: *e2e-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    env_file: .env
    environment: *e2e-storage-endpoint
    command: python -m devtools.storage_bootstrap --cors-origin http://localhost:5273
    depends_on:
      myjourney_s3:
        condition: service_healthy
    restart: "no"

  # RESEND_BASE_URL → мёртвый адрес: письма-джобы упрутся в connection refused (упадут в
  # throwaway-БД), реальный Resend не дёргается.
  myjourney_worker:
    <<: *e2e-backend
    environment:
      <<: *e2e-storage-endpoint
      RESEND_BASE_URL: "http://localhost:9"
    depends_on:
      myjourney_s3_bootstrap:
        condition: service_completed_successfully

  # Без хост-порта — фронт ходит к нему по внутренней сети проекта.
  app:
    <<: *e2e-backend
    environment: *e2e-storage-endpoint
    depends_on:
      myjourney_s3_bootstrap:
        condition: service_completed_successfully
    command: sh -c "uvicorn app.main:create_app --factory --no-use-colors --host 0.0.0.0 --port 8000 --log-level error"
    # 127.0.0.1, а не localhost: uvicorn слушает IPv4 (--host 0.0.0.0), а localhost в alpine/musl
    # резолвится в IPv6 ::1 первым → connection refused (та же ловушка, что у frontend ниже).
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s

  # Единственный проброшенный наружу порт (5273 ≠ дев-5173). Playwright бьёт сюда (E2E_BASE_URL),
  # /v1 проксируется на app внутри сети проекта. dev-CMD сам делает npm install (named-volume
  # node_modules на первом старте пуст — см. frontend/Dockerfile).
  frontend:
    build:
      # target: dev — Vite dev-сервер (:5173). Без target собралась бы последняя стадия
      # `final` (nginx :80): фронт вставал nginx'ом, healthcheck на :5173 не проходил → unhealthy.
      target: dev
    environment:
      API_PROXY_TARGET: "http://app:8000"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5273:5173"
    volumes:
      - ./frontend:/app
      - frontend_e2e_node_modules:/app/node_modules
    # 127.0.0.1, а не localhost: vite слушает IPv4 (--host 0.0.0.0), а busybox-wget резолвит
    # localhost в IPv6 ::1 → "Connection refused", хотя dev-сервер готов (проверено на живом контейнере).
    #
    # start_period большой намеренно: `make test-e2e` делает `down -v`, стирая named-volume
    # node_modules → на каждом прогоне dev-CMD ставит всё дерево заново (`npm install`). Холодная
    # установка полного дерева (three.js/react-globe.gl/Mantine, ~700 МБ) на volume Docker Desktop
    # (медленная запись многих мелких файлов через VM-FS) — минуты, а сам Vite стартует за ~200 мс.
    # start_period НЕ добавляет задержки, когда фронт готов быстро: контейнер становится healthy на
    # первой успешной проверке. Окно лишь покрывает холодную установку, чтобы `up --wait frontend`
    # не объявил unhealthy до того, как поднимется dev-сервер.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 360s
    depends_on:
      app:
        condition: service_healthy

volumes:
  frontend_e2e_node_modules:
