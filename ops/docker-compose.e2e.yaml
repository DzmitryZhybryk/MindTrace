# Одноразовый стек для фронтовых Playwright-e2e.
#
# Зачем отдельный файл, а не дев-стек: e2e сеют пользователей через POST /v1/auth/register/,
# и при прогоне против дев-стека (docker-compose.yaml) они копятся в персистентной mindtrace_pg
# (том pg_data) навсегда. Здесь Postgres живёт в tmpfs (RAM) без named-тома → БД исчезает на
# `down`, дев-база не трогается. Это перенос подхода backend-testcontainers (одноразовая БД на
# прогон) на уровень стека — e2e нужно всё приложение, а не голый Postgres.
#
# Запуск — корневым `make test-e2e` (up --wait frontend → playwright → down -v). Свой проект
# (`name`) изолирует контейнеры/тома/сеть от дев-стека: можно держать оба разом. `container_name`
# нигде не задаём (compose сам префиксует проектом → нет клеша с дев), сеть — дефолтная проектная
# (`docker network create` не нужен). Имена сервисов mindtrace_pg/app совпадают с хостами в .env и
# vite.config (API_PROXY_TARGET) → .env переиспользуется как есть, без env-оверрайдов кроме Resend.
name: mindtrace_e2e

services:

  # Имя сервиса = POSTGRES_HOST из .env. tmpfs → данные в RAM, без named-тома: умирают на `down`.
  mindtrace_pg:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: postgres -c log_min_messages=warning
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  # One-shot: накатывает app-схему (alembic) и схему procrastinate, затем выходит. Те же команды, что
  # у прод-migrate и дев-`make migrate-upgrade`. app и worker ждут его завершения.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    command: sh -c "uv run alembic upgrade head && uv run python -m app.shared.infra.procrastinate"
    env_file: .env
    # dev-образ код внутрь не копирует (см. backend/Dockerfile, target dev) — монтируем как базовый compose.
    volumes: &backend_mounts
      - ./backend/app:/src/app
      - ./backend/migrations:/src/migrations
      - ./backend/alembic.ini:/src/alembic.ini:ro
      - ./backend/pyproject.toml:/src/pyproject.toml:ro
    depends_on:
      mindtrace_pg:
        condition: service_healthy
    restart: "no"

  # Штатный worker, исполняет письма-джобы. Схему procrastinate применяет migrate, поэтому app от
  # worker'а не зависит. RESEND_BASE_URL → мёртвый адрес: письма-джобы упрутся в connection refused
  # (упадут в throwaway-БД), реальный Resend не дёргается.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    command: python -m app.worker
    env_file: .env
    environment:
      RESEND_BASE_URL: "http://localhost:9"
    volumes: *backend_mounts
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Имя сервиса = API_PROXY_TARGET host из vite.config. Ждёт migrate: после него в БД обе схемы,
  # app-таблицы и procrastinate. Без хост-порта — фронт ходит к нему по внутренней сети проекта.
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    command: sh -c "uvicorn app.main:create_app --factory --no-use-colors --host 0.0.0.0 --port 8000 --log-level error"
    env_file: .env
    volumes: *backend_mounts
    # 127.0.0.1, а не localhost: uvicorn слушает IPv4 (--host 0.0.0.0), а localhost в alpine/musl
    # резолвится в IPv6 ::1 первым → connection refused (та же ловушка, что у frontend ниже).
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s
    depends_on:
      migrate:
        condition: service_completed_successfully
      geo-load:
        condition: service_completed_successfully

  # One-shot: грузит газеттир после миграций. Кеш общий с дев-стеком (хост).
  geo-load:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    command: sh -c "uv run python -m app.geo.infra.datasets"
    env_file: .env
    volumes:
      - ./backend/app:/src/app
      - ./backend/pyproject.toml:/src/pyproject.toml:ro
      - ./backend/.geo-cache:/src/.geo-cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Единственный проброшенный наружу порт (5273 ≠ дев-5173). Playwright бьёт сюда (E2E_BASE_URL),
  # /v1 проксируется на app внутри сети проекта. dev-CMD сам делает npm install (named-volume
  # node_modules на первом старте пуст — см. frontend/Dockerfile).
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # target: dev — Vite dev-сервер (:5173). Без target собралась бы последняя стадия
      # `final` (nginx :80): фронт вставал nginx'ом, healthcheck на :5173 не проходил → unhealthy.
      target: dev
    environment:
      API_PROXY_TARGET: "http://app:8000"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5273:5173"
    volumes:
      - ./frontend:/app
      - frontend_e2e_node_modules:/app/node_modules
    # 127.0.0.1, а не localhost: vite слушает IPv4 (--host 0.0.0.0), а busybox-wget резолвит
    # localhost в IPv6 ::1 → "Connection refused", хотя dev-сервер готов (проверено на живом контейнере).
    #
    # start_period большой намеренно: `make test-e2e` делает `down -v`, стирая named-volume
    # node_modules → на каждом прогоне dev-CMD ставит всё дерево заново (`npm install`). Холодная
    # установка полного дерева (three.js/react-globe.gl/Mantine, ~700 МБ) на volume Docker Desktop
    # (медленная запись многих мелких файлов через VM-FS) — минуты, а сам Vite стартует за ~200 мс.
    # start_period НЕ добавляет задержки, когда фронт готов быстро: контейнер становится healthy на
    # первой успешной проверке. Окно лишь покрывает холодную установку, чтобы `up --wait frontend`
    # не объявил unhealthy до того, как поднимется dev-сервер.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 360s
    depends_on:
      app:
        condition: service_healthy

volumes:
  frontend_e2e_node_modules:
