# Dependabot: держит закреплённые на commit-SHA GitHub Actions в актуальном состоянии.
# Экшены запинены на SHA (supply-chain hardening) — Dependabot раз в неделю поднимает PR с
# обновлением SHA до свежих релизов, иначе пины заморозили бы и security-патчи самих экшенов.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # Один PR на все обновления экшенов вместо N отдельных.
      github-actions:
        patterns:
          - "*"

  # npm-зависимости фронта (симметрия с backend: uv audit в CI ловит уязвимости).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      npm:
        patterns:
          - "*"

  # Базовые Docker-образы запинены по digest (supply-chain) — Dependabot поднимает PR при
  # выходе нового digest тега, иначе пины заморозили бы и security-патчи самих образов.
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /ops
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
