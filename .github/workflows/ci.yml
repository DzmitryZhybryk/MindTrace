name: CI

# Быстрый гейт: на каждый PR (dev и main) и push main — lint, typecheck, unit/api/component.
# Тяжёлые тесты (integration + e2e), сборка образов и деплой вынесены в prod.yml и триггерятся
# только на пути в прод (PR -> main / push main), поэтому на PR -> dev здесь НЕТ skipped-чеков.
# Блокировка мержа при красных — через branch protection (Required status checks) в настройках репо.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

# Отменяем устаревшие прогоны только для PR; на push main гейт не прерываем.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python (из backend/.python-version)
        run: uv python install

      - name: Sync deps (frozen)
        run: uv sync --frozen

      - name: Quality gate (format-check, lint, typecheck, arch, dead-code, audit, unit+api)
        run: make check-ci

  frontend:
    name: Frontend gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps (ci)
        run: npm ci

      - name: Codegen drift (src/api/generated == backend/openapi.json)
        run: |
          make generate-api
          git diff --exit-code -- src/api/generated \
            || { echo "::error::SDK устарел — прогони 'make fe-generate-api' и закоммить результат"; exit 1; }

      - name: Quality gate (lint, typecheck, unit+component)
        run: make check
