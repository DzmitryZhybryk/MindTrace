<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Preload of ONE Lora subset: regular-style Latin. All headings, including the hero LCP element,
      use it; without preload they render in the fallback face first and then jump. The other seven
      subsets (italic, Cyrillic) are deliberately not preloaded: they are needed in fragments, and
      preload downloads unconditionally and would take bandwidth from critical resources.
      crossorigin is required even for the same origin, otherwise the browser downloads the file twice.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/lora-normal-latin.woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser UI colour on mobile. Must match the product surface (`--ink`), otherwise the browser
         chrome would be light over a dark app. -->
    <meta name="theme-color" content="#0b1020" />
    <meta
      name="description"
      content="MyJourney is a quiet atlas of where you've been — save every trip and watch cities, routes, and the years between them trace across a living globe."
    />
    <title>MyJourney — the world, the way you traveled it</title>

    <!--
      The preview image is deliberately NOT set. `/favicon.svg` would not work for two reasons at
      once: og:image requires an ABSOLUTE URL (a crawler does not resolve a relative path), and no
      major aggregator supports SVG as a preview format; a raster (PNG/JPG) is needed, 1200x630
      recommended.
      A link to a nonexistent preview is worse than none: the platform shows a broken card instead
      of building one from title and description. Restore og:image and twitter:card=summary_large_image
      together with a real og-cover.png file and a known domain (the canonical URL is not fixed yet).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MyJourney — the world, the way you traveled it" />
    <meta
      property="og:description"
      content="A quiet atlas of where you've been. Save every trip and watch it draw across a living globe."
    />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="MyJourney — the world, the way you traveled it" />
    <meta
      name="twitter:description"
      content="A quiet atlas of where you've been. Save every trip and watch it draw across a living globe."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
