# Статический сервер SPA. Проксирование /v1 на backend делает внешний Caddy —
# здесь только отдача собранного бандла с корректным кэшированием и SPA-fallback.
server {
    # :8080 — образ nginx-unprivileged работает под non-root (uid 101), порт >1024 не требует root.
    listen 8080;
    server_name _;
    # Не светить версию nginx в заголовке Server и на страницах ошибок.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Хэшированные ассеты Vite (имя меняется при каждой сборке) — иммутабельны, кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Самохостные шрифты. Лежат в public/, поэтому Vite НЕ добавляет хэш в имя — путь
    # `/fonts/lora-normal-latin.woff2` стабилен между релизами, и на него завязан
    # <link rel="preload"> в index.html.
    #
    # Год кэша, но БЕЗ `immutable`: имя не меняется при обновлении самого шрифта, а
    # `immutable` запрещает браузеру перепроверять файл даже по явной перезагрузке —
    # заменив Lora, мы бы навсегда оставили части пользователей старую. Обычная
    # ревалидация стоит один 304 и снимает этот риск.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        try_files $uri =404;
    }

    # Фавиконка меняется чаще шрифтов (ребрендинг) — месяц вместо года.
    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # index.html не кэшируем: он ссылается на свежие хэши ассетов после каждого релиза.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA-fallback: любой не-файловый путь отдаёт index.html (клиентский роутинг React).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
