# Static SPA server. Proxying /v1 to the backend is done by the external Caddy; here only the built
# bundle is served, with correct caching and the SPA fallback.
server {
    # :8080: the nginx-unprivileged image runs non-root (uid 101), a port >1024 needs no root.
    listen 8080;
    server_name _;
    # Do not expose the nginx version in the Server header or on error pages.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed Vite assets (the name changes on every build) are immutable: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Self-hosted fonts. They live in public/, so Vite does NOT add a hash to the name: the path
    # `/fonts/lora-normal-latin.woff2` is stable across releases, and <link rel="preload"> in
    # index.html depends on it.
    #
    # A year of cache but WITHOUT `immutable`: the name does not change when the font itself is
    # updated, and `immutable` forbids the browser to revalidate even on an explicit reload, so
    # replacing Lora would leave some users on the old one forever. Plain revalidation costs one
    # 304 and removes that risk.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        try_files $uri =404;
    }

    # The favicon changes more often than fonts (rebranding): a month instead of a year.
    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Do not cache index.html: it references fresh asset hashes after every release.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any non-file path serves index.html (React client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
