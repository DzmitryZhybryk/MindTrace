[project]
name = "MindTrace"
version = "0.8.1"
description = "Service for managing mindtrace"
authors = [
    { name = "Dzmitry Zhybryk", email = "mr.zhybryk@gmail.com" }
]
requires-python = ">=3.14"
readme = "README.md"

dependencies = [
    "fastapi[standard]>=0.124.4",
    "alembic>=1.17.2",
    "orjson>=3.11.5",
    "pydantic-settings>=2.12.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "structlog>=25.5.0",
    "uvicorn>=0.38.0",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.10.0",
    "httpx>=0.28.0",
    "procrastinate>=3.8.1",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.9",
    "ty>=0.0.3",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
exclude = [
    # for local development
    "service-lib",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules
select = [
    "E",     # pycodestyle (Error)
    "W",     # pycodestyle (Warning)
    "F",     # Pyflakes
    "C90",   # mccabe - name is too complex
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "ASYNC", # flake8-async
    "S",     # flake8-bandit - security issues
    "B",     # flake8-bugbear - common bugs
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "FA",    # flake8-future-annotations
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "SLF",   # flake8-self
    "SIM",   # flake8-simplify
    "ERA",   # eradicate - Found commented-out code
    "PLE",   # Pylint Error
    "TRY",   # tryceratops
    "RUF",   # Ruff-specific rules (unused imports, etc.)
    "PERF",  # Performance checks
]
unfixable = [
    "ERA", # do not autoremove commented out code
]
ignore = [
    "RUF001", # Это и ниже для того, чтобы разрешить кириллицу в комментариях/docstrings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = []

"migrations/versions/*" = []

"app/infra/components/registry.py" = [
    "RUF002", # Docstring содержит неоднозначные символы (разрешить кириллицу в комментариях/docstrings)
    "RUF003",
]

[tool.ruff.lint.pep8-naming]
# Allow Pydantic's `@validator` decorator to trigger class method treatment.
# https://github.com/astral-sh/ruff/issues/2868
classmethod-decorators = ["pydantic.validator", "pydantic.root_validator"]

[tool.ty.rules]
unused-ignore-comment = "warn"
redundant-cast = "ignore"
possibly-missing-attribute = "error"
possibly-missing-import = "error"

[tool.ty]
# Override rules for specific files
# Pydantic Settings loads values from .env at runtime, so missing-argument is expected
overrides = [
    { include = ["app/shared/settings.py"], rules = { "missing-argument" = "ignore" } },
]

[tool.vulture]
paths = ["app", "vulture_whitelist.py"]
min_confidence = 60
# Декораторы, после которых vulture не должен считать функцию мёртвой:
# фреймворк (FastAPI/Starlette) или Pydantic вызывают такие функции неявно.
ignore_decorators = [
    # FastAPI/APIRouter HTTP-методы (любой роутер: app, router, *_router)
    "@*.get",
    "@*.post",
    "@*.put",
    "@*.delete",
    "@*.patch",
    "@*.head",
    "@*.options",
    "@*.exception_handler",
    "@*.middleware",
    "@*.on_event",
    # Pydantic-валидаторы
    "@field_validator",
    "@model_validator",
    "@validator",
    "@root_validator",
    # Контекст-менеджеры lifespan
    "@asynccontextmanager",
    "@contextmanager",
]
